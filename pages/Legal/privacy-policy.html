<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Privacy Policy | NA Scoliosis Foundation</title>
    <link rel="stylesheet" href="../../assets/css/tokens.css" />
    <link rel="stylesheet" href="../../assets/css/main.css" />
    <style>
        /* Clean, self-contained fallback styling matching the site layout */
        :root {
            --primary-color: #1f4e5f;
            --accent-color: #2e8b57;
            --text-color: #222222;
            --muted-text: #555555;
            --bg-light: #f8fafb;
            --border-color: #dce3e6;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            line-height: 1.65;
            color: var(--text-color);
            margin: 0;
            padding: 0;
            background-color: #ffffff;
        }

        header.site-header {
            background-color: var(--primary-color);
            color: #ffffff;
            padding: 1rem 2rem;
        }

        nav.site-nav {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        nav.site-nav a {
            color: #ffffff;
            text-decoration: none;
            margin-left: 1.25rem;
            font-weight: 500;
        }

        nav.site-nav a:hover {
            text-decoration: underline;
        }

        .policy-container {
            max-width: 860px;
            margin: 2.5rem auto;
            padding: 0 1.5rem;
        }

        .policy-header {
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 1.25rem;
            margin-bottom: 2rem;
        }

        .policy-header h1 {
            color: var(--primary-color);
            margin-bottom: 0.4rem;
            font-size: 2rem;
        }

        .last-updated {
            color: var(--muted-text);
            font-size: 0.95rem;
        }

        section.policy-section {
            margin-bottom: 2rem;
        }

        section.policy-section h2 {
            color: var(--primary-color);
            font-size: 1.35rem;
            margin-bottom: 0.6rem;
        }

        ul.policy-list {
            padding-left: 1.4rem;
        }

        ul.policy-list li {
            margin-bottom: 0.5rem;
        }

        .callout-box {
            background-color: var(--bg-light);
            border-left: 4px solid var(--primary-color);
            padding: 1rem 1.25rem;
            border-radius: 4px;
            margin: 1rem 0;
        }

        footer.site-footer {
            background-color: var(--bg-light);
            border-top: 1px solid var(--border-color);
            text-align: center;
            padding: 1.5rem;
            margin-top: 3rem;
            font-size: 0.9rem;
            color: var(--muted-text);
        }

        footer.site-footer a {
            color: var(--primary-color);
            text-decoration: none;
        }

        footer.site-footer a:hover {
            text-decoration: underline;
        }
